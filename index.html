<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="description" content="साईदेखि साईसम्मको वार्षिक स्मारिका — भगवान् श्री सत्य साई बाबाका भक्तहरूका कविता, अनुभव, लेख अनि नियात्राको संग्रह। वर्ष २०१६ देखि प्रकाशित।"/>
<title>साईदेखि साईसम्म · sai2sai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FDF8F2; --paper2:#EDF5F3; --card:#FFFFFF; --ink:#1A2A3A; --soft:#5A6878;
  --kumkum:#D97018; --indigo:#1A5050; --gold:#A87820; --line:#C2DDD8;
  --leaf:#3A8A50; --plum:#7040A0; --sky:#2870B8;
  --faint:rgba(26,42,58,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Serif Devanagari",serif;font-size:17.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--kumkum);outline-offset:3px;border-radius:2px}
.deva-display{font-family:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}

/* ── Header ── */
header.site{
  border-bottom:2px solid var(--line);
  border-bottom-color:transparent;
  background:rgba(253,248,242,.96);
  backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:200;
  box-shadow:0 1px 0 0 var(--line), 0 2px 0 0 rgba(217,112,24,.15);
}
.site-in{display:flex;align-items:center;justify-content:space-between;gap:14px;
  max-width:1140px;margin:0 auto;padding:14px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;background:none;border:none;cursor:pointer;
  color:inherit;padding:0;font-family:inherit}
.logo-mark{flex-shrink:0;display:flex;align-items:center}
.mark{font-family:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif;font-size:clamp(17px,2.2vw,24px);letter-spacing:.3px}
.mark .two{color:var(--kumkum)}
.mark-sub{font-family:"Tiro Devanagari Hindi",serif;font-size:18px;color:var(--indigo);
  border-left:1px solid var(--line);padding-left:11px;margin-left:2px}

/* ── Footer ── */
footer.site{border-top:1px solid var(--line);padding:28px 0;color:var(--soft);font-size:14px}
footer.site .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
footer a{color:var(--gold);text-decoration:none}
footer a:hover{text-decoration:underline}
.footer-social{display:flex;gap:14px;align-items:center}
.footer-social a{color:var(--soft);display:inline-flex;align-items:center;gap:5px;
  font-size:13px;transition:color .15s;text-decoration:none!important}
.footer-social a:hover{color:var(--kumkum)}
.footer-social svg{flex-shrink:0}

/* ── Genre chips ── */
.chip{display:inline-block;font-size:12.5px;line-height:1;padding:5px 10px 6px;
  border-radius:100px;letter-spacing:.02em;white-space:nowrap;
  font-family:"Noto Serif Devanagari",serif;font-weight:500}
.g-लेख{background:rgba(26,80,80,.10);color:var(--indigo)}
.g-कविता{background:rgba(217,112,24,.10);color:var(--kumkum)}
.g-अनुभव{background:rgba(58,138,80,.13);color:var(--leaf)}
.g-चिन्तन{background:rgba(168,120,32,.15);color:#8a6818}
.g-नियात्रा{background:rgba(40,112,184,.12);color:var(--sky)}
.g-अन्तर्वार्ता{background:rgba(112,64,160,.12);color:var(--plum)}
.g-सम्पादकीय,.g-प्रकाशकीय{background:rgba(90,104,120,.12);color:var(--soft)}

/* ── Buttons ── */
.btn{font-family:"Noto Serif Devanagari",serif;font-size:16px;background:var(--kumkum);
  color:#fff;border:none;padding:12px 26px;border-radius:100px;cursor:pointer;transition:.16s;
  display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn:hover{background:#b85e10}
.btn-outline{font-family:"Noto Serif Devanagari",serif;font-size:15px;background:none;
  color:var(--indigo);border:1.5px solid var(--indigo);padding:10px 22px;border-radius:100px;
  cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-outline:hover{background:var(--indigo);color:#fff}
.pdfbtn{font-family:"Noto Serif Devanagari",serif;font-size:15px;background:var(--indigo);
  color:#fff;border:none;padding:10px 22px;border-radius:100px;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pdfbtn:hover{background:#0f3838}
button svg,a svg{vertical-align:-0.125em;flex-shrink:0}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.back{background:none;border:none;color:var(--kumkum);font-family:"Noto Serif Devanagari",serif;
  font-size:15px;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
.back:hover{text-decoration:underline}

/* ── Animation ── */
.fade{animation:fadeIn .34s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ══════════════ SHELF ══════════════ */
.shelf-hero{padding:52px 0 36px}
.kicker{font-size:13px;letter-spacing:.18em;color:var(--kumkum);margin:0 0 12px;text-transform:uppercase}
.shelf-hero h1{font-family:"Tiro Devanagari Hindi",serif;font-size:clamp(52px,8vw,96px);
  line-height:1;margin:0;letter-spacing:.5px}
.shelf-hero .lead{max-width:56ch;color:var(--soft);margin:18px 0 0;font-size:18.5px}

/* Featured card */
.feat-card{display:grid;grid-template-columns:200px 1fr;gap:32px;
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 20px 56px -30px rgba(26,42,58,.38);padding:28px;
  align-items:center;margin-bottom:40px}
.feat-card .cov{width:100%;display:block;border:1px solid var(--line);
  box-shadow:0 12px 28px -14px rgba(26,42,58,.45)}
.feat-card h2{font-family:"Tiro Devanagari Hindi",serif;font-size:38px;margin:0 0 6px;line-height:1.05}
.feat-card .vol-label{font-size:13.5px;letter-spacing:.1em;color:var(--gold);margin:0 0 16px}
.feat-card .stats{color:var(--soft);font-size:15.5px;margin:0 0 22px}

/* Badges */
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:100px;
  letter-spacing:.06em;margin-left:10px;vertical-align:middle;
  font-family:"Noto Serif Devanagari",serif;font-weight:600}
.badge-new{background:var(--kumkum);color:#fff}
.badge-centenary{background:var(--gold);color:#fff}

/* Volume grid */
.vols-section{padding-bottom:80px}
.section-label{font-size:12.5px;letter-spacing:.18em;color:var(--gold);
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:24px;text-transform:uppercase}
.vols-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.vol-card{background:none;border:none;cursor:pointer;padding:0;
  text-align:left;font-family:inherit;color:inherit;display:flex;flex-direction:column}
.vol-card:hover .vol-thumb{transform:translateY(-4px);box-shadow:0 18px 44px -18px rgba(26,42,58,.45)}
.vol-thumb{width:100%;aspect-ratio:2/3;background:var(--paper2);border:1px solid var(--line);
  overflow:hidden;transition:transform .22s,box-shadow .22s;border-radius:3px;
  box-shadow:0 6px 22px -12px rgba(26,42,58,.32);position:relative}
.vol-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vol-sticker{position:absolute;top:8px;right:8px;font-size:10px;padding:3px 8px;
  border-radius:100px;font-family:"Noto Serif Devanagari",serif;font-weight:600}
.vol-sticker-c{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:10px;padding:3px 10px;border-radius:100px;
  font-family:"Noto Serif Devanagari",serif;font-weight:600;white-space:nowrap}
.vol-info-chip{padding:10px 2px 0}
.vol-info-chip .vi-num{font-family:"Tiro Devanagari Hindi",serif;font-size:16px;color:var(--ink);line-height:1.25}
.vol-info-chip .vi-year{font-size:12px;color:var(--soft);letter-spacing:.04em}
.vol-info-chip .vi-tag{font-size:11px;color:var(--leaf);margin-top:3px;letter-spacing:.01em}

/* ══════════════ VOLUME VIEW ══════════════ */
.back-bar{padding:16px 0 4px}
.reader{display:grid;grid-template-columns:300px 1fr;gap:40px;
  padding:6px 0 80px;align-items:start}
.toc{position:sticky;top:68px;max-height:calc(100vh - 88px);
  overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.toc .yr{font-family:"Tiro Devanagari Hindi",serif;font-size:34px;line-height:1.1;color:var(--ink)}
.toc .vr{font-size:13px;letter-spacing:.1em;color:var(--gold);margin:4px 0 6px}
.toc .meta{font-size:14px;color:var(--soft);margin-bottom:14px}
.toc-actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.toc-label{font-size:12px;letter-spacing:.18em;color:var(--gold);
  border-bottom:1px solid var(--line);padding-bottom:8px;margin:16px 0 4px;text-transform:uppercase}
.toc-list{list-style:none;margin:0;padding:0}
.ti{border:none;background:none;width:100%;text-align:left;font-family:inherit;color:inherit;
  cursor:pointer;padding:9px 10px 10px 12px;display:grid;
  grid-template-columns:32px 1fr;gap:10px;border-left:2px solid transparent;transition:.14s}
.ti:hover{background:var(--paper2)}
.ti[aria-current="true"]{border-left-color:var(--kumkum);background:var(--paper2)}
.ti .pg{font-family:"Tiro Devanagari Hindi",serif;font-size:15px;color:var(--gold);
  text-align:right;padding-top:2px}
.ti .tt{font-size:15.5px;line-height:1.35}
.ti .au{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.ti .cw{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

/* Colophon */
.colophon{margin-top:18px;border:1px solid var(--line);border-radius:6px;background:rgba(200,238,232,.25);
  padding:14px 16px;font-size:13.5px;color:var(--soft);line-height:1.75}
.colophon h4{font-family:"Tiro Devanagari Hindi",serif;color:var(--ink);margin:0 0 10px;font-size:17px}
.colophon b{color:var(--ink);font-weight:500}

/* Article page */
.page{background:var(--card);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 18px 50px -30px rgba(26,42,58,.38);
  padding:34px clamp(20px,4vw,48px) 42px;min-height:480px;scroll-margin-top:76px}
.art-head{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:28px;overflow:hidden}
.art-pg{float:right;font-family:"Tiro Devanagari Hindi",serif;color:var(--gold);font-size:16px}
.art-title{font-family:"Tiro Devanagari Hindi",serif;font-size:clamp(26px,4.2vw,44px);
  line-height:1.12;margin:14px 0 14px;letter-spacing:.3px}
.art-by{font-size:18px;color:var(--indigo)}
.art-by b{font-family:"Tiro Devanagari Hindi",serif;font-weight:400}
.art-place{color:var(--soft);font-size:15px;margin-top:2px}

/* PDF view within article */
.pdf-view{display:flex;flex-direction:column;align-items:center;gap:16px;
  padding:36px 0 28px;text-align:center}
.pdf-icon{opacity:.45;line-height:1;display:flex;justify-content:center;color:var(--kumkum)}
.pdf-note{font-size:15.5px;color:var(--soft);max-width:46ch;line-height:1.65;margin:0}

/* No-content panel */
.no-articles{padding:40px 32px;background:var(--card);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 18px 50px -30px rgba(26,42,58,.38);display:flex;gap:34px;align-items:flex-start}
.na-cover{flex-shrink:0;width:160px}
.na-cover img{width:100%;display:block;border:1px solid var(--line);
  box-shadow:0 8px 20px -12px rgba(26,42,58,.40)}
.na-body h2{font-family:"Tiro Devanagari Hindi",serif;font-size:34px;margin:0 0 6px;line-height:1.1}
.na-label{font-size:13.5px;letter-spacing:.1em;color:var(--gold);margin-bottom:4px}
.na-desc{font-size:16px;color:var(--soft);line-height:1.65;margin:0 0 22px}
.na-soon{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);
  display:flex;gap:18px;align-items:flex-start}
.na-soon .om{font-family:"Tiro Devanagari Hindi",serif;font-size:36px;
  color:var(--kumkum);opacity:.35;line-height:1;flex-shrink:0}
.na-soon-text h3{font-family:"Tiro Devanagari Hindi",serif;font-size:22px;color:var(--ink);margin:0 0 6px}
.na-soon-text p{font-size:15px;color:var(--soft);margin:0;line-height:1.6}

/* Pager */
.pager{display:flex;justify-content:space-between;gap:14px;
  margin-top:36px;padding-top:22px;border-top:1px solid var(--line)}
.pgb{background:none;border:1px solid var(--line);color:var(--ink);
  font-family:"Noto Serif Devanagari",serif;font-size:14px;
  padding:10px 16px;border-radius:4px;cursor:pointer;transition:.15s;max-width:48%;text-align:left}
.pgb:hover:not(:disabled){border-color:var(--kumkum);color:var(--kumkum)}
.pgb:disabled{opacity:.3;cursor:default}
.pgb.next{text-align:right}
.pgb small{display:block;font-size:12px;color:var(--soft)}

/* ══════════════ CONTRIBUTORS ══════════════ */
.contrib{display:grid;grid-template-columns:280px 1fr;gap:40px;padding:16px 0 80px;align-items:start}
.az{position:sticky;top:68px}
.az h2{font-family:"Tiro Devanagari Hindi",serif;font-size:32px;margin:0 0 4px}
.az .hint{color:var(--soft);font-size:14px;margin:0 0 16px;line-height:1.6}
.az-list{list-style:none;margin:0;padding:0;
  max-height:calc(100vh - 260px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.azi{border:none;background:none;width:100%;text-align:left;cursor:pointer;color:inherit;
  font-family:inherit;padding:10px 0;border-bottom:1px solid var(--line);transition:.14s;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.azi:hover{padding-left:6px;color:var(--kumkum)}
.azi[aria-current="true"]{color:var(--kumkum)}
.azi .nm{font-family:"Tiro Devanagari Hindi",serif;font-size:18px}
.azi .ct{font-size:12px;color:var(--soft);white-space:nowrap}
.azi .pl{font-size:12.5px;color:var(--soft);flex-shrink:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mala{display:flex;flex-direction:column;gap:4px}
.who{font-family:"Tiro Devanagari Hindi",serif;font-size:36px;margin:0 0 2px;line-height:1.1}
.who-pl{color:var(--soft);font-size:15px;margin:0 0 2px}
.who-n{font-size:14px;color:var(--gold);letter-spacing:.06em;margin:0 0 22px}
.thread{display:flex;flex-direction:column;gap:12px}
.bead{background:var(--card);border:1px solid var(--line);padding:16px 20px;
  text-align:left;cursor:pointer;font-family:inherit;color:inherit;transition:.15s;
  border-radius:5px;width:100%}
.bead:hover{border-color:var(--kumkum);box-shadow:0 4px 14px -8px rgba(217,112,24,.28)}
.bt{font-family:"Tiro Devanagari Hindi",serif;font-size:20px;margin:6px 0 6px;line-height:1.25}
.bm{font-size:13px;color:var(--soft)}

/* ══════════════ RESPONSIVE ══════════════ */
@media(max-width:960px){
  .vols-grid{grid-template-columns:repeat(3,1fr);gap:14px}
  .reader{grid-template-columns:1fr}
  .toc{position:static;max-height:none;overflow:visible}
  .contrib{grid-template-columns:1fr}
  .az{position:static}
  .az-list{max-height:280px}
}
@media(max-width:640px){
  .vols-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .feat-card{grid-template-columns:110px 1fr;gap:16px;padding:18px}
  .feat-card h2{font-size:22px}
  .no-articles{flex-direction:column}
  .na-cover{width:120px}
  .shelf-hero{padding:36px 0 24px}
  .nav-journey-label{display:none}
  .nav-journey-short{display:inline!important}
}

/* ══════════════ PDF READER ══════════════ */
.pdf-layout{display:grid;grid-template-columns:1fr 300px;grid-template-rows:1fr;height:calc(100vh - 62px);overflow:hidden}
.pdf-main{grid-column:1;grid-row:1}
.pdf-sidebar{grid-column:2;grid-row:1;overflow:hidden;border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column}
.pdf-sb-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.pdf-sb-title{font-family:"Tiro Devanagari Hindi",serif;font-size:16px;color:var(--ink);margin:0 0 3px;line-height:1.2}
.pdf-sb-sub{font-size:13px;color:var(--soft);margin:0}
.pdf-sb-filter{padding:10px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.pdf-sb-filter select{width:100%;font-size:13.5px;padding:6px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--paper);color:var(--ink);font-family:"Noto Serif Devanagari",serif}
.pdf-toc{list-style:none;margin:0;padding:6px 0;overflow-y:auto;flex:1;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  -webkit-overflow-scrolling:touch}
.pdf-tg{padding:10px 16px 4px;font-size:11px;letter-spacing:.14em;color:var(--gold);
  text-transform:uppercase;font-family:"Noto Serif Devanagari",serif;flex-shrink:0}
.pdf-ti{display:flex;align-items:flex-start;gap:10px;padding:9px 14px 9px 12px;
  cursor:pointer;border:none;background:none;width:100%;text-align:left;
  border-left:3px solid transparent;transition:.15s;color:inherit;font-family:inherit}
.pdf-ti:hover{background:var(--faint)}
.pdf-ti[aria-current="true"]{background:rgba(217,112,24,.08);border-left-color:var(--kumkum)}
.pdf-ti-body{flex:1;min-width:0}
.pdf-ti-title{font-size:14px;color:var(--ink);line-height:1.35;font-family:"Noto Serif Devanagari",serif}
.pdf-ti-auth{font-size:12px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdf-ti-pg{font-size:13px;color:var(--gold);flex-shrink:0;font-variant-numeric:tabular-nums;padding-top:1px}

.pdf-main{display:flex;flex-direction:column;overflow:hidden}
.pdf-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--card);flex-shrink:0;flex-wrap:wrap}
.pdf-back{background:none;border:1px solid var(--line);color:var(--soft);
  font-size:13.5px;padding:5px 12px;border-radius:6px;cursor:pointer;
  font-family:"Noto Serif Devanagari",serif;transition:.15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px}
.pdf-back:hover{border-color:var(--ink);color:var(--ink)}
.pdf-pgnav{display:flex;align-items:center;gap:5px;margin-left:auto}
.pdf-pgbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1}
@media(hover:hover){.pdf-pgbtn:hover:not(:disabled){background:var(--indigo);color:#fff;border-color:var(--indigo)}}
.pdf-pgbtn:active:not(:disabled){background:var(--indigo);color:#fff;border-color:var(--indigo)}
.pdf-pgbtn:disabled{opacity:.28;cursor:default}
.pdf-pginput{width:46px;text-align:center;border:1px solid var(--line);border-radius:6px;
  padding:5px 4px;font-size:14px;background:var(--paper);color:var(--ink);
  font-family:"Noto Serif Devanagari",serif}
.pdf-pgtotal{font-size:13.5px;color:var(--soft);white-space:nowrap}
.pdf-zoom{display:flex;align-items:center;gap:5px;margin-left:10px}
.pdf-zbtn{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1}
@media(hover:hover){.pdf-zbtn:hover{background:var(--paper2)}}
.pdf-zbtn:active{background:var(--paper2)}
.pdf-zlabel{font-size:12.5px;color:var(--soft);min-width:38px;text-align:center}
.pdf-fitbtn{font-size:11px;padding:0 8px;width:auto;letter-spacing:.04em}
.pdf-zbtn:disabled{opacity:.28;cursor:default}

/* article breadcrumb in toolbar */

.pdf-layout.sb-hidden{grid-template-columns:1fr}

/* reading progress bar */
.pdf-progress{height:3px;background:var(--line);flex-shrink:0;overflow:hidden}
.pdf-progress-bar{height:100%;background:var(--kumkum);width:0%;
  transition:width .3s ease;border-radius:0 2px 2px 0}

/* ── Page turn animation ── */
.pdf-canvas-area{flex:1;overflow:auto;background:var(--paper2);display:flex;
  justify-content:center;align-items:flex-start;padding:28px 20px}
.pdf-flip-stage{display:grid;perspective:1200px;flex-shrink:0}
.pdf-page-wrap{grid-area:1/1;position:relative;backface-visibility:hidden;
  box-shadow:0 6px 32px -8px rgba(26,42,58,.50);background:#fff;line-height:0}
.pdf-page-wrap canvas{display:block}
/* old page folds away, revealing new page beneath — like a real book */
@keyframes pdf-exit-fwd{
  0%  {transform:rotateY(0deg);opacity:1}
  80% {opacity:1}
  100%{transform:rotateY(-90deg);opacity:0}
}
@keyframes pdf-exit-bwd{
  0%  {transform:rotateY(0deg);opacity:1}
  80% {opacity:1}
  100%{transform:rotateY(90deg);opacity:0}
}
.pdf-turn-exit-fwd{animation:pdf-exit-fwd .4s ease-in both;transform-origin:left center}
.pdf-turn-exit-bwd{animation:pdf-exit-bwd .4s ease-in both;transform-origin:right center}
.pdf-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;

.pdf-spinner{width:34px;height:34px;border:3px solid var(--line);
  border-top-color:var(--kumkum);border-radius:50%;animation:pdfSpin .65s linear infinite}
@keyframes pdfSpin{to{transform:rotate(360deg)}}
.pdf-err{text-align:center;color:var(--kumkum);font-size:15px;padding:48px 24px}
.pdf-err .ei{font-size:42px;margin-bottom:14px;opacity:.5}

}

/* ════════════════════════════════════════════════════
   ROUTING
   ════════════════════════════════════════════════════ */
function go(view, params){
  const prevView = S.view, prevVol = S.vol;
  // Remove PDF keyboard listener when leaving pdf view; restore body scroll
  if(S.view==='pdf' && view!=='pdf'){
    document.removeEventListener('keydown',_pdfKey);
    document.body.style.overflow='';
    if(_pdfAnimCleanup){ _pdfAnimCleanup(); _pdfAnimCleanup=null; }
  }
  Object.assign(S, {view}, params||{});
  if(view==='shelf') S.showColophon=false;
  if(view==='volume'){
    if(!('itemId' in (params||{}))) S.itemId=0;
    S.showColophon=false;
  }
  if(view==='pdf'){
    if(prevView !== 'pdf') S.pdfFrom = {view:prevView, vol:prevVol, authorIdx:S.authorIdx};
    if(!('pdfPage' in (params||{}))) S.pdfPage=1;
    _pdfFullpage=false; _pdfDrawerOpen=false;
    document.addEventListener('keydown',_pdfKey);
    window.scrollTo({top:0, behavior:'instant'});
  }
  if(view==='contributors'){
    const vol = volByNum(S.vol);
    if(vol && vol.items.length){
      const m = byAuthor(vol.items);
      const names = sortedNames(m);
      if(S.authorIdx >= names.length) S.authorIdx=0;
    }
  }
  if(view==='allContributors'){
    const m = allByAuthor();
    const names = sortedNames(m);
    if(S.authorIdx >= names.length) S.authorIdx=0;
  }
  _updateNav();
  render();
  if(view!=='pdf'){
    if(view==='volume' && prevView==='volume' && S.vol===prevVol){
      // next/prev within same volume: scroll article into view
      const art = document.querySelector('article.page');
      if(art) art.scrollIntoView({behavior:'smooth', block:'start'});
    } else {
      window.scrollTo({top:0, behavior:'smooth'});
    }
  }
  const h = _stateHash();
  if(location.hash !== h) history.pushState(null,'',h);
}

function goContrib(){
  // Find the most recent volume with article data
  const vol = [...VOLUMES].reverse().find(v=>v.items.length>0) || VOLUMES[VOLUMES.length-1];
  go('contributors',{vol:vol.vol, authorIdx:0});
}

function selectAuthor(idx){
  S.authorIdx = idx;
  render();
  const h = _stateHash();
  if(location.hash !== h) history.pushState(null,'',h);
}

function _updateNav(){
  const activeView = (S.view==='shelf'||S.view==='volume'||S.view==='pdf') ? 'shelf' :
                     S.view==='journey' ? 'journey' : 'allContributors';
  document.querySelectorAll('.nav-tab').forEach(btn=>{
    if(btn.dataset.view===activeView) btn.setAttribute('aria-current','true');
    else btn.removeAttribute('aria-current');
  });
}

   ════════════════════════════════════════════════════ */
function _stateHash(){
  const v = S.vol;
  if(S.view==='shelf') return '#shelf';
  if(S.view==='volume') return S.itemId>0 ? `#v${v}/a${S.itemId}` : `#v${v}`;
  if(S.view==='contributors') return S.authorIdx>0 ? `#contrib/${v}/i${S.authorIdx}` : `#contrib/${v}`;
  if(S.view==='pdf') return S.pdfPage>1 ? `#pdf/${v}/p${S.pdfPage}` : `#pdf/${v}`;
  if(S.view==='allContributors') return S.authorIdx>0 ? `#contributors/i${S.authorIdx}` : '#contributors';
  if(S.view==='journey') return '#journey';
  return '#shelf';
}

function _parseHash(){
  const h = decodeURIComponent(location.hash.replace(/^#/,''));
  if(!h || h==='shelf') return {view:'shelf'};
  const parts = h.split('/');
  if(parts[0].match(/^v\d+$/)){
    const vol = parseInt(parts[0].slice(1));
    if(parts[1] && parts[1].match(/^a\d+$/))
      return {view:'volume', vol, itemId:parseInt(parts[1].slice(1))};
    return {view:'volume', vol};
  }
  if(parts[0]==='contrib'){
    const vol = parseInt(parts[1]);
    if(!isNaN(vol)){
      const authorIdx = parts[2]&&parts[2].match(/^i\d+$/) ? parseInt(parts[2].slice(1)) : 0;
      return {view:'contributors', vol, authorIdx};
    }
    return {view:'contributors'};
  }
  if(parts[0]==='pdf'){
    const vol = parseInt(parts[1]);
    const pdfPage = parts[2]&&parts[2].match(/^p\d+$/) ? parseInt(parts[2].slice(1)) : 1;
    return {view:'pdf', vol, pdfPage};
  }
  if(parts[0]==='contributors'){
    const authorIdx = parts[1]&&parts[1].match(/^i\d+$/) ? parseInt(parts[1].slice(1)) : 0;
    return {view:'allContributors', authorIdx};
  }
  if(parts[0]==='journey') return {view:'journey'};
  return {view:'shelf'};
}

/* ════════════════════════════════════════════════════
   PERMALINK COPY
   ════════════════════════════════════════════════════ */
async function copyPermalink(e, hash){
  e.preventDefault();
  const url = location.origin + location.pathname + hash;
  const btn = e.currentTarget;
  try {
    await navigator.clipboard.writeText(url);
    const orig = btn.innerHTML;
    btn.innerHTML = icon('check');
    btn.classList.add('perma-copied');
    setTimeout(()=>{ btn.innerHTML=orig; btn.classList.remove('perma-copied'); }, 1600);
  } catch(_){}
}

function selectAllAuthor(idx){
  S.authorIdx=idx;
  render();
  const h=_stateHash();
  if(location.hash!==h) history.pushState(null,'',h);
  // On mobile (single column), scroll the profile into view
  if(window.innerWidth<=960){
    const panel=document.querySelector('.cpro-panel');
    if(panel) panel.scrollIntoView({behavior:'smooth',block:'start'});
  } else {
    // Scroll the active item into view in the sidebar list
    const activeBtn=document.querySelector('.azi[aria-current="true"]');
    if(activeBtn) activeBtn.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
}

function filterContribSearch(q){
  const query=(q||'').trim().toLowerCase();
  let anyVisible=false;
  document.querySelectorAll('.azi[data-cname]').forEach(btn=>{
    const nm=btn.dataset.cname.toLowerCase();
    const hide=query && !nm.includes(query);
    btn.style.display=hide?'none':'';
    if(!hide) anyVisible=true;
  });
  const empty=document.getElementById('caz-empty');
  if(empty) empty.style.display=(query&&!anyVisible)?'':'none';
}

function viewAllContributors(){
  const m=allByAuthor();
  const names=sortedNames(m);
  if(!names.length){
    return `<div class="wrap fade" style="padding:70px 0;text-align:center;color:var(--soft)">
      <div style="font-size:52px;color:var(--kumkum);opacity:.35;margin-bottom:18px;font-family:'Tiro Devanagari Hindi',serif">ॐ</div>
      <h2 style="font-family:'Tiro Devanagari Hindi',serif;color:var(--ink);margin:0 0 12px">योगदानकर्ता विवरण उपलब्ध छैन</h2>
      <button class="btn" style="margin-top:24px" onclick="go('shelf')">${icon('arrow-left')} अङ्कहरूमा फर्कनुहोस्</button>
    </div>`;
  }

  if(S.authorIdx>=names.length) S.authorIdx=0;
  const curName=names[S.authorIdx];
  const pieces=m[curName]||[];

  // most recent volume cover for profile photo
  const recentVol=pieces[pieces.length-1]._vol;
  const ph=placeholderSrc(recentVol);

  // collect unique volumes this author appeared in
  const uniqueVolNums=[...new Set(pieces.map(p=>p._vol.vol))];
  const totalVols=uniqueVolNums.length;

  // most recent place (from most recent article)
  const recentPlace=pieces[pieces.length-1].place||'';
  // all unique places (show up to 2)
  const allPlaces=[...new Set(pieces.map(p=>p.place).filter(Boolean))];
  const placeDisplay=allPlaces.slice(0,2).join(' · ')+(allPlaces.length>2?' · …':'');

  // group articles by volume (most recent first)
  const byVol={};
  pieces.forEach(p=>{
    const k=p._vol.vol;
    if(!byVol[k]) byVol[k]=[];
    byVol[k].push(p);
  });
  const volKeys=Object.keys(byVol).map(Number).sort((a,b)=>b-a);

  const volGroups=volKeys.map(vn=>{
    const vol=byVol[vn][0]._vol;
    const beads=byVol[vn].map(p=>{
      const pdfPg=p.page+(vol.pageOffset||0);
      return `<button class="bead" onclick="go('pdf',{vol:${vol.vol},pdfPage:${pdfPg}})">
        ${chip(p.genre)}
        <div class="bt">${p.title}</div>
        <div class="bm">पृष्ठ ${deva(p.page)} · PDF मा खोल्नुहोस् ${icon('arrow-right')}</div>
      </button>`;
    }).join('');
    return `<div class="vol-grp">
      <div class="vol-grp-hd"><span class="vgn">${vol.name}</span> वर्ष ${vol.volD} · ${vol.year}</div>
      <div class="vol-thread">${beads}</div>
    </div>`;
  }).join('');

  const azList=names.map((n,i)=>{
    const arts=m[n];
    const vols=new Set(arts.map(a=>a._vol.vol)).size;
    return `<li><button class="azi" data-cname="${n.replace(/"/g,'&quot;')}" aria-current="${i===S.authorIdx}" onclick="selectAllAuthor(${i})">
      <span style="min-width:0"><span class="nm">${n}</span><span class="ct"> · ${deva(arts.length)}</span></span>
      <span class="pl">${vols>1?deva(vols)+' अङ्क':arts[0].place||''}</span>
    </button></li>`;
  }).join('');

  const totalPieces=names.reduce((s,n)=>s+m[n].length,0);

  return `<div class="wrap fade">
  <div class="contrib">
    <aside class="az">
      <h2 class="deva-display">योगदानकर्ता</h2>
      <p class="hint">${deva(VOLUMES.length)} अङ्कमा ${deva(names.length)} स्रष्टाका ${deva(totalPieces)} रचना। नाम छान्नुहोस्।</p>
      <input class="caz-search" type="search" placeholder="नाम खोज्नुहोस्…" aria-label="योगदानकर्ता खोज्नुहोस्"
        oninput="filterContribSearch(this.value)" autocomplete="off">
      <ul class="az-list" id="caz-list">${azList}</ul>
      <div class="caz-empty" id="caz-empty" style="display:none">कुनै नाम फेला परेन।</div>
    </aside>
    <section class="cpro-panel" aria-live="polite">
      <div class="cpro-head">
        <div class="cpro-cover">
          <img src="${recentVol.cover}" alt="${recentVol.name}" onerror="this.onerror=null;this.src='${ph}'" title="नवीनतम योगदान: वर्ष ${recentVol.volD} · ${recentVol.name}">
        </div>
        <div class="cpro-meta">
          <h3 class="cpro-name">${curName}</h3>
          ${placeDisplay?`<p class="cpro-pl">${placeDisplay}</p>`:''}
          <p class="cpro-stat">${deva(pieces.length)} रचना · ${deva(totalVols)} अङ्क</p>
        </div>
      </div>
      ${volGroups}
    </section>
  </div>
  </div>`;
}

          <p>विचार-विमर्शको क्रमलाई निरन्तर राख्दै ग्रीष्मकालीन बिदा (अप्रिल-मई) को छुट्टीमा हामी पुट्टपर्तीबाट दार्जीलिङ घर गएको बेला यो दिन एउटा फाइलमा १७ वटा नवीन रचनाहरूको संकलन बोकेर, सिलगढी अगमसिह गिरी नगर पञ्चनदी गुरुवर श्री हरि शर्मा पराजुलीको निजी बासगृहमा पहिलो पत्रिकाको अङ्कबारे छलफल गर्न एक सानो भेटवार्तामा भाग लिन सरको घरमा पुग्छु।</p>
          <p>यस भेटवार्तामा गुरुवर हरि शर्मा, श्री विवेक केशर पाण्डे, श्री सूरज गुरुङ (सम्बोधन पब्लिकेसन, सालुगढा), साई विद्यार्थी नैतिक तामङ अनि बसन्त प्रधान उपस्थित थिए।</p>
          <p>पत्रिकाको विभिन्न नामहरूको सल्लाह-सुझावपछि श्री बसन्त प्रधानद्वारा सुझाव दिइएको <strong>"ओम्"</strong> नामलाई सबैले स्वीकार गरे। त्यसपछि पहिलो अङ्क "ओम्" अनि आगामी वर्षका अङ्कहरूमा सह-शीर्षक थप्दै जाने निष्कर्ष भयो। टङ्कन अनि सज्जाको जिम्मा श्री सूरज गुरुङ (सम्बोधन पब्लिकेसन) लाई दिइयो।</p>
        </div>
      </div>
    </section>

    <section class="journey-section">
      <h2>पहिलो संरचना</h2>
      <p>भगवान् बाबाको असीम कृपाले केही महिना भित्रमा यो परियोजनाको पहिलो संरचना तयार हुन्छ —</p>
      <div class="journey-colophon">
        <h3>ओम् — प्रथम अङ्क विवरण</h3>
        <p><strong>पत्रिकाको नाम:</strong> ओम्</p>
        <p><strong>भाषा/विधा:</strong> नेपाली (पूर्ण रङ्गिन) नेपाली साई आध्यात्मिक पत्रिका</p>
        <p><strong>प्रकाशन संख्या:</strong> ९९९+१</p>
        <p><strong>प्रकाशक:</strong> साई देखि साई सम्मको पक्षबाट संयोजक एवं प्रकाशकद्वय — श्री बसन्त प्रधान / श्री आदित्य मोक्तान</p>
        <p><strong>प्रकाशन मिति:</strong> भगवान्‌को ९१औँ जन्मदिन — २३ नोभेम्बर २०१६</p>
        <p><strong>पृष्ठ संख्या:</strong> ९१ (हरेक वर्ष एक पृष्ठ थपिँदै गएर अन्तिम अङ्क १०० पन्नाको)</p>
        <p><strong>टङ्कन एवं सज्जा:</strong> श्री सूरज गुरुङ, सिलगढी</p>
        <p><strong>छापाखाना:</strong> पहिलो ७ अङ्क — ओमकार अफसेट प्रिन्टिङ प्रेस बेङ्गलोर; रहेका ३ अङ्क — सिस्टेमेटिक डिजाइनर्स एन्ड प्रिन्टर्स प्रा. लि., सिलगढी</p>
      </div>
      <p>विश्वका विभिन्न प्रान्तहरूमा यसरी छरिएर बसेको हाम्रो यो सम्पूर्ण टोलीलाई एकजुटमा बाँधेर राख्न सकेको थियो त केवल भगवान् बाबाको दिव्य अनुग्रहले मात्र। हातमा भएको सानो मोबाइलको भरमा हाम्रो यो संरचना चल्थ्यो। भेटेर एकसाथ बसेर हामीले यो परियोजनाबारे छलफल गर्न भौतिक रूपमा सम्भव थिएन।</p>
      <p>बेङ्गलोर छापाबाट एक हप्तामा ओम् पत्रिकाको एक हजार प्रति तयार भएपछि ९९+१ पुट्टपर्ती अनि नौ सय सिलगढी गुरुवर हरि शर्मा ज्यूको ठेगानामा प्रेषित गरियो। श्री सत्य साई सेवा समिति दार्जीलिङ अनि सिक्किम राज्यको संयोजन/समन्वय एवं अग्रजहरूको आशीर्वाद एवं पूर्ण सहयोग प्राप्त भएर यो कार्य पनि सुगम अनि सरल भयो।</p>
    </section>

    <section class="journey-section">
      <h2>व्यवस्थापन कार्यका अग्रणीहरू</h2>
      <p>यस परियोजनाको वितरण एवं व्यवस्थापन आजसम्म यथावत् चलिरहेको छ — यी समर्पित सदस्यहरूको अथक परिश्रमले:</p>
      <ul class="journey-name-list">
        <li>आदित्य मोक्तान</li><li>सुशील छेत्री</li><li>जिग्मी लेप्चा</li>
        <li>सूरज गुरुङ</li><li>अविनाश सुब्बा</li><li>अम्बर थापा</li>
        <li>कुन्दन राई</li><li>निखिल राई</li><li>दीपनारायण प्रधान</li>
        <li>विशाल छेत्री</li><li>जोशिब राई</li><li>प्रणेश थामी</li>
        <li>योगेश मोक्तान</li><li>सफलमणि प्रधान</li><li>निमेश सुब्बा</li>
        <li>नोर्की यल्मो</li><li>रञ्जु राई</li><li>बसन्त प्रधान</li>
        <li>डि बी सुब्बा</li><li>एच आर भट्टराई</li><li>साथै अन्य धेरै...</li>
      </ul>
    </section>

    <section class="journey-section">
      <h2>सम्पादन, प्रकाशन अनि संरचना</h2>
      <h3>सम्पादक मण्डली</h3>
      <p><strong>पहिलो ५ वर्ष (२०१६–२०२०):</strong> श्री हरि शर्मा (सिलगढी), श्री वि. के. पाण्डे (कालेबुङ), श्री कृष्ण सिंह मोक्तान, श्रीमती विन्द्या सुब्बा (दार्जीलिङ); प्रकाशन पक्ष — श्री आदित्य मोक्तान अनि श्री बसन्त प्रधान।</p>
      <p><strong>दोस्रो ५ वर्ष (२०२१–२०२५):</strong> मूल सम्पादक मण्डली — डा. आदित्य मोक्तान, डा. मनोहर भुजेल, श्री सुशील छेत्री; प्रकाशकद्वय — श्री बसन्त प्रधान, श्री निमेश सुब्बा।</p>
      <p>चौथो अङ्कको निम्ति युवा साहित्यकार श्री सुवास छेत्री "भावुक" पनि सह-सम्पादक मण्डलीका सदस्य भए। श्री सूरज गुरुङ (सम्बोधन पब्लिकेसन, सालुगढा) ले सम्पूर्ण अङ्कमा टङ्कन अनि सज्जाको कार्य गर्नुभयो।</p>
      <h3>आवरण एवं लोगो</h3>
      <p>ओम् को पहिलो कभर डिजाइनर एवं लोगो श्री भुवेस रामुदामु; त्यसपछिका डिजाइनर समूहमा — श्री आशिष विसुन्के, बसन्त शर्मा अनि सुमिरण तामङ — सबै साई विद्यार्थीहरू। हाल नियमित कभर डिजाइनर नेपाल धरान निवासी साई विद्यार्थी श्री आशिष विसुन्के हुन्।</p>
      <h3>डिजिटल उपस्थिति</h3>
      <p><strong>फेसबुक अनि यूट्युब (२०१८ देखि):</strong> साई देखि साई सम्मका विविध समाचार, सन्देश, रचना अनि भिडियोहरू विश्वका नेपाली भाषा बोल्ने साई भक्तहरूसम्म पुर्याउने संकल्पसँग। देखरेख — श्री आदित्य मोक्तान अनि श्री बसन्त शर्मा।</p>
      <p><strong>वेब पेज:</strong> पहिलो वेब पेजको सृजना साई विद्यार्थी श्री सनिक थापाले गर्नुभयो। पछि गुरुपूर्णिमाको पवन अवसरमा ५ जुलाई २०२०, आइतवार — साई विद्यार्थी श्री बसन्त शर्माको पुनः प्रयासमा यो समूहको पहिलो आधिकारिक गुगल वेब पेज <a href="http://www.sai2sai.in" target="_blank" rel="noopener" style="color:var(--indigo)">www.sai2sai.in</a> नामले सर्वसाधारणको निम्ति प्रकाशित गरियो।</p>
    </section>

    <section class="journey-section">
      <h2>कृतज्ञता एवं संरक्षक</h2>
      <p>ओम् को परिकल्पना भगवान्‌को आशिष एवं निम्न महानुभावहरूको सहयोगबिना साकार हुन सम्भव थिएन। पहिलो अङ्क पत्रिका छापाको निम्ति प्रतिदर पाँच हजार रुपियाँ गरेर १६ सदस्यहरूले सहयोग दान गर्नुभएको थियो —</p>
      <ul class="journey-name-list">
        <li>श्री विजय मंगर</li><li>श्री प्रणय सुब्बा</li><li>श्री अनुप प्रधान</li>
        <li>श्री बसन्त प्रधान</li><li>श्री वि. के. पाण्डे</li><li>श्रीमती विन्द्या सुब्बा</li>
        <li>श्रीमती प्रज्ञा प्रधान</li><li>सुश्री रञ्जु राई</li><li>सुश्री देवी भुजेल</li>
        <li>श्री हरि शर्मा पराजुली</li><li>श्री आदित्य मोक्तान</li><li>श्री जोशिब राई</li>
        <li>श्री सृजन राई</li><li>श्री विशाल छेत्री</li><li>श्री दीपनारायण प्रधान</li>
        <li>श्री सागर लिम्बु</li>
      </ul>
      <p style="margin-top:16px">पछि आशिष छेत्री (तेस्रो अङ्क), नोर्की यल्मो (छैटौँ अङ्क), अविनाश लिम्बू (सातौँ अङ्क), निखिल राई (सातौँ अङ्क) ले सहयोग राशि प्रदान गर्नुभयो।</p>
      <h3>संरक्षक मण्डली</h3>
      <p>हिमाली राज्य सिक्किम श्री सत्य साई सेवा समितिका राज्य सभापति श्री पुनम प्रधान ज्यु अनि श्री सत्य साई सेवा समिति (प. ब.-२) का राज्य सभापति श्री विजय मंगर ज्यु — सतत सहयोग अनि संरक्षणको निम्ति सदैव कृतज्ञता व्यक्त गर्दछौँ।</p>
      <p>भगवान् बाबाको असीम कृपा प्राप्त साल १९९१ देखि सेवाको निम्ति निरन्तर कार्यरत् श्री सत्य साई सुपर स्पेशियालिटी हस्पिटलकी सिनियर परिचारिका सुश्री देवी भुजेल [भगवान् स्वयंले उहाँलाई बोलाउने गरेको नाम "नेपाली नर्स"] को संरक्षणमा यो समूहले यत्तिका वर्षसम्म कार्य गर्दै आइरहेको छ। पछि श्रीमती विन्द्या सुब्बा अनि श्रीमती प्रज्ञा प्रधान संरक्षक मण्डलीमा समाविष्ट गरिए।</p>
      <h3>कोष संरक्षक</h3>
      <p>साल २०११ मा पुट्टपर्तीबाट एमबीए उत्तीर्ण गरेर अहिले केन्द्र सरकार अधीनस्थ कर्मचारी कालेबुङ निवासी श्री प्रणय सुब्बाद्वारा यो परियोजनामा चाहिने कोषको देखरेख गरियो (पहिलो ५ वर्ष); त्यसपछिका ५ वर्ष सुश्री नोर्की यल्मो कोष संयोजिका रहिन्। यो पत्रिकाको वार्षिक खर्च विवरण हरेक वर्षको अप्रिल महिनामा साई देखि साई सम्मको ग्रुपमा उहाँद्वारा प्रेषित गरिन्छ।</p>
    </section>

    <section class="journey-section">
      <h2>प्रकाशन तालिका</h2>
      <p>हरेक वर्ष भगवान्‌को जन्मदिवस <strong>२३ नोभेम्बर</strong> मा ओम् पत्रिकाको अङ्क भगवान्‌को चरण कमलमा अर्पण गरेर विभिन्न क्षेत्रहरूमा वितरण गरिन्छ। सोही किताबको सफ्ट कपी <strong>२४ अप्रिल</strong> आराधना महोत्सवको दिन साईदेखि साईसम्मको आधिकारिक वेबसाइट <a href="http://www.sai2sai.in" target="_blank" rel="noopener" style="color:var(--indigo)">www.sai2sai.in</a> मा निःशुल्क सबैको निम्ति अपलोड गरिन्छ।</p>
      <p><strong>पत्रिका सहयोग राशि (प्रति):</strong> पहिलो ५ वर्ष — रु. ८० (२०१६–२०२०); दोस्रो ५ वर्ष — रु. १०० (२०२१–२०२५)।</p>
    </section>

    <section class="journey-section">
      <h2>अनुभव अनि अनुग्रह</h2>
      <p>पत्रिका आध्यात्मिक साहित्यको एक विधा भएकोले यसको सहि संयोजन अनि संरक्षण गर्न हामी नवोदित कलमकारहरू सायदै असमर्थ हुने थियौँ होला यदि संरक्षकको रूपमा हामीसँग भगवान् 'साई' स्वयं नउभिएको भए! कलम हाम्रो भएतापनि मसी साईको थियो, शब्द हामीले कोरे तापनि भावना उनले भरेको थियो।</p>
      <p>१० वर्षमा रचना संकलन, सम्पादन, व्यवस्थापनमा कहीँ-कत्तै बाधा अनि संकट न आइपुग्नु भनेको — उनको यो पूर्ण अनुग्रह हो। साईले अपरिपक्वतालाई परिपक्वता अनि सिकारूलाई यही कार्यमा दक्ष बनाउनुभयो।</p>
      <p>हामी जस्ता मसिना हातहरूलाई कलमकारको रूपमा उभ्याउन सहयोग गर्नुहुने दक्ष, परिज्ञाता अनि सुहृदयी गुरुहरूलाई नमन गर्दछौँ — गुरुवर हरि शर्मा, गुरुमा विन्द्या सुब्बा, सूरज गुरुङ।</p>
    </section>

    <section class="journey-section">
      <h2>"ओम्" श्रृङ्खला — दश अङ्क</h2>
      <p>ओम् पत्रिका शुरू देखि आजसम्म (१ देखि १०) प्रकाशित अङ्कहरू —</p>

          <div class="om-card-num">अङ्क ${s.num}</div>
          <div class="om-card-name">${s.name}</div>
          <div class="om-card-year">${s.year}</div>
        </button>`).join('')}
      </div>
    </section>

    <section class="journey-section">
      <h2>अन्त तिर...</h2>

  // Build author filter options
  const authors = [...new Set(items.map(x=>x.author))].sort((a,b)=>a.localeCompare(b,'hi'));
  const filterOpts = `<option value="">— सबै योगदानकर्ता —</option>`
    + authors.map(a=>`<option value="${a}">${a}</option>`).join('');

  // Build sidebar TOC (id="ptoc-{page}")

  // Build drawer TOC (id="dtoc-{page}")

    const genres = [...new Set(items.map(x=>x.genre))];
    genres.forEach(g => {
      tocRows += `<li class="pdf-tg">${g}</li>`;
      drawerRows += `<li class="pdf-tg">${g}</li>`;
      items.filter(x=>x.genre===g).forEach(it => {

    <div class="pdf-main">

        <button class="pdf-back" onclick="_pdfBack()">${icon('arrow-left')} ${S.pdfFrom&&S.pdfFrom.view==='allContributors'?'योगदानकर्ता':'अङ्क विवरण'}</button>
        <div class="pdf-crumb" id="pcrumb"></div>
        <div class="pdf-pgnav">

          <input class="pdf-pginput" id="ppg" type="number" min="1" value="1"

    <button class="pfn-fit" onclick="pdfFit()" title="पृष्ठ अनुसार">${icon('expand')} FIT</button>
    ${hasToc?`<div class="pfn-sep"></div><button class="pfn-toc-btn" id="pfn-toc-btn" onclick="pdfFullpageTocToggle()" title="अनुक्रमणिका लुकाउनुहोस्">${icon('menu')}<span class="pfn-toc-label"> लुकाउनुहोस्</span></button>`:''}

  <!-- Slide-in TOC drawer (fullpage mode) -->
  <div class="pdf-toc-drawer" id="pdf-toc-drawer" aria-label="अनुक्रमणिका">
    <div class="pdf-drawer-head">
      <p class="pdf-drawer-title">${vol.name} — अनुक्रमणिका</p>
      <button class="pdf-drawer-close" onclick="pdfDrawerClose()" aria-label="बन्द गर्नुहोस्">${icon('x')}</button>
    </div>

  </div>
  <div class="pdf-drawer-overlay" id="pdf-drawer-overlay" onclick="pdfDrawerClose()"></div>`;

/* ── PDF.js loader (lazy, once) ── */
function _loadPdfJs(cb){
  if(window.pdfjsLib){ cb(); return; }
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload=()=>{
    pdfjsLib.GlobalWorkerOptions.workerSrc=
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    cb();
  };
  s.onerror=()=>_pdfError('PDF.js लोड हुन सकेन।');
  document.head.appendChild(s);
}

function _initPdfReader(){
  const vol=volByNum(S.vol)||VOLUMES[VOLUMES.length-1];
  if(!vol.pdf) return;
  // Restore sidebar collapsed state
  if(_pdfSidebarHidden){
    const layout=document.getElementById('pdf-layout');
    if(layout) layout.classList.add('sb-hidden');
  }
  // Touch swipe: left=next, right=prev
  const pca=document.getElementById('pca');
  if(pca){
    let _tx=0,_ty=0;
    pca.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
    pca.addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-_tx;
      const dy=e.changedTouches[0].clientY-_ty;
      if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>60){dx<0?pdfNext():pdfPrev();}
    },{passive:true});
  }
  _loadPdfJs(()=>{
    // Re-use already-loaded doc for same volume
    if(_pdfForVol===vol.vol && _pdf){
      _pdfApplyTotal(); _pdfNoAnim=true; _renderPage(S.pdfPage||1); return;
    }
    // Fetch as ArrayBuffer so the real URL never appears in browser UI
    fetch(vol.pdf)
      .then(r=>{ if(!r.ok) throw new Error('fetch failed'); return r.arrayBuffer(); })
      .then(buf=>pdfjsLib.getDocument({data:buf}).promise)
      .then(doc=>{
        _pdf=doc; _pdfTotal=doc.numPages; _pdfForVol=vol.vol;
        _pdfApplyTotal();
        _pdfCanvas='a'; _pdfNoAnim=true;
        _renderPage(S.pdfPage||1);
      })
      .catch(()=>_pdfError('यो अङ्कको PDF हाल उपलब्ध छैन।'));
  });
}

function _pdfApplyTotal(){
  const el=document.getElementById('ptotal');
  if(el) el.textContent=deva(_pdfTotal);
  const fel=document.getElementById('pfn-total');
  if(fel) fel.textContent=deva(_pdfTotal);
  const fip=document.getElementById('pfn-pg');
  if(fip) fip.max=_pdfTotal;
  const sip=document.getElementById('ppg');
  if(sip) sip.max=_pdfTotal;
}

function _pdfError(msg){
  const el=document.getElementById('ploading');
  if(el) el.innerHTML=`<div class="pdf-err"><div class="ei">⚠</div>${msg}</div>`;
}

function _renderPage(num){
  if(!_pdf) return;
  if(_pdfRendering){ _pdfPending=num; return; }
  num=Math.max(1,Math.min(num,_pdfTotal));

  // Determine animation direction before updating S.pdfPage
  const prevNum=S.pdfPage;
  const doAnim=!_pdfNoAnim && _pdfTotal>0 && prevNum>0 && num!==prevNum;
  const dir=num>=prevNum?'fwd':'bwd';
  _pdfNoAnim=false;

  S.pdfPage=num;
  const pg=document.getElementById('ppg');
  const pb=document.getElementById('pprev');
  const nb=document.getElementById('pnext');
  if(pg) pg.value=num;
  if(pb) pb.disabled=num<=1;
  if(nb) nb.disabled=num>=_pdfTotal;
  const fpg=document.getElementById('pfn-pg');
  const fpb=document.getElementById('pfn-prev');
  const fnb=document.getElementById('pfn-next');
  if(fpg) fpg.value=num;
  if(fpb) fpb.disabled=num<=1;
  if(fnb) fnb.disabled=num>=_pdfTotal;
  _pdfRendering=true;

  // Double-buffer: render new page to the inactive canvas
  const nextCv=doAnim?(_pdfCanvas==='a'?'b':'a'):_pdfCanvas;
  const canvasId=nextCv==='a'?'pcanvas':'pcanvas2';
  const wrapId  =nextCv==='a'?'ppwrap' :'ppwrap2';
  const oldWrapId=_pdfCanvas==='a'?'ppwrap':'ppwrap2';

  _pdf.getPage(num).then(page=>{
    // Compute scale
    const area=document.getElementById('pca');
    let sc=typeof _pdfZoom==='number'?_pdfZoom:1.5;
    if(_pdfZoom==='fit'&&area){
      const cs=getComputedStyle(area);
      const aw=area.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
      const ah=area.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
      const vp0=page.getViewport({scale:1});
      sc=Math.min(aw/vp0.width, ah/vp0.height, 2.5);
    }
    const vp=page.getViewport({scale:sc});
    // Render at device pixel ratio for crisp text on high-DPI screens
    const dpr=Math.min(window.devicePixelRatio||1,3);
    const vpHi=page.getViewport({scale:sc*dpr});
    const canvas=document.getElementById(canvasId);
    const wrap=document.getElementById(wrapId);
    const load=document.getElementById('ploading');
    if(!canvas){_pdfRendering=false;return;}
    canvas.width=vpHi.width; canvas.height=vpHi.height;
    canvas.style.width=vp.width+'px'; canvas.style.height=vp.height+'px';
    if(load) load.style.display='none';
    const zlbl=document.getElementById('pzlbl');
    if(zlbl) zlbl.textContent=Math.round(sc*100)+'%';
    page.render({canvasContext:canvas.getContext('2d'),viewport:vpHi}).promise.then(()=>{
      const ca=document.getElementById('pca');
      if(ca) ca.scrollTop=0;
      if(doAnim && wrap){
        // Cancel any in-progress animation cleanly
        if(_pdfAnimCleanup){ _pdfAnimCleanup(); _pdfAnimCleanup=null; }
        const oldWrap=document.getElementById(oldWrapId);
        if(oldWrap){
          const exitCls='pdf-turn-exit-'+dir;
          const exitAnim='pdf-exit-'+dir;
          // New page sits flat underneath; old page folds away to reveal it
          wrap.style.display='';
          wrap.style.zIndex='1';
          oldWrap.style.zIndex='2';
          void oldWrap.offsetWidth;
          oldWrap.classList.add(exitCls);
          let cancelled=false;
          _pdfAnimCleanup=()=>{
            cancelled=true;
            oldWrap.classList.remove(exitCls);
            oldWrap.style.display='none';
            oldWrap.style.zIndex='';
            wrap.style.display='';
            wrap.style.zIndex='';
            _pdfAnimCleanup=null;
          };
          const onExitEnd=(e)=>{
            if(e.animationName!==exitAnim) return;
            oldWrap.removeEventListener('animationend',onExitEnd);
            if(cancelled) return;
            oldWrap.classList.remove(exitCls);
            oldWrap.style.display='none';
            oldWrap.style.zIndex='';
            wrap.style.zIndex='';
            _pdfAnimCleanup=null;
          };
          oldWrap.addEventListener('animationend',onExitEnd);
        }
        _pdfCanvas=nextCv;
      } else {
        // No animation: just show new canvas, hide old if switching
        if(nextCv!==_pdfCanvas){
          const oldWrap=document.getElementById(oldWrapId);
          if(oldWrap) oldWrap.style.display='none';
        }
        if(wrap){ wrap.style.display=''; wrap.style.opacity='1'; }
        _pdfCanvas=nextCv;
      }
      const prog=document.getElementById('pprogress');
      if(prog&&_pdfTotal>0) prog.style.width=(num/_pdfTotal*100)+'%';
      _pdfRendering=false;
      if(_pdfPending!==null){const p=_pdfPending;_pdfPending=null;_renderPage(p);}
      _tocHighlight(num);
    });
  });
}

function _scrollTocEl(el, containerId){
  const container=document.getElementById(containerId);
  if(!el||!container) return;
  const eRect=el.getBoundingClientRect();
  const cRect=container.getBoundingClientRect();
  if(eRect.top<cRect.top||eRect.bottom>cRect.bottom){
    container.scrollTop+=eRect.top-cRect.top-(cRect.height-eRect.height)/2;
  }
}

function _tocHighlight(pageNum){
  const vol=volByNum(S.vol);
  if(!vol||!vol.items.length) return;
  const items=vol.items.filter(x=>!x.front);
  const offset=vol.pageOffset||0;
  let cur=null;
  for(let i=items.length-1;i>=0;i--){ if(items[i].page+offset<=pageNum){cur=items[i];break;} }
  const crumb=document.getElementById('pcrumb');
  if(crumb) crumb.innerHTML=cur
    ?`<span class="pdf-crumb-genre">${cur.genre}</span>${cur.title}`:'';
  document.querySelectorAll('.pdf-ti').forEach(el=>el.setAttribute('aria-current','false'));
  if(cur){
    const el=document.getElementById(`ptoc-${cur.page}`);
    if(el){ el.setAttribute('aria-current','true'); _scrollTocEl(el,'pdf-toc'); }
    const del=document.getElementById(`dtoc-${cur.page}`);
    if(del){
      del.setAttribute('aria-current','true');
      if(_pdfDrawerOpen) _scrollTocEl(del,'pdf-dtoc');
    }
  }
}

/* ── Public PDF controls ── */
function _pdfBack(){
  const f = S.pdfFrom;
  if(f && f.view==='allContributors') go('allContributors',{authorIdx:f.authorIdx});
  else if(f && f.view==='contributors') go('contributors',{vol:f.vol,authorIdx:f.authorIdx});
  else go('volume',{vol:S.vol});
}
function pdfJump(n){ if(!isNaN(n)) _renderPage(n); }
function pdfPrev(){ if(S.pdfPage>1) _renderPage(S.pdfPage-1); }
function pdfNext(){ if(S.pdfPage<_pdfTotal) _renderPage(S.pdfPage+1); }
function _updateZoomBtns(){
  const atMin=typeof _pdfZoom==='number'&&_pdfZoom<=.4;
  const atMax=typeof _pdfZoom==='number'&&_pdfZoom>=3;
  ['pzout','pfn-zout'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=atMin;});
  ['pzin','pfn-zin'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=atMax;});
}
function pdfZoomIn(){ _pdfZoom=typeof _pdfZoom==='number'?Math.min(_pdfZoom+.2,3):1.7; _updateZoomBtns(); _pdfNoAnim=true; _renderPage(S.pdfPage); }
function pdfZoomOut(){ _pdfZoom=typeof _pdfZoom==='number'?Math.max(_pdfZoom-.2,.4):1.0; _updateZoomBtns(); _pdfNoAnim=true; _renderPage(S.pdfPage); }
function pdfFit(){ _pdfZoom='fit'; _updateZoomBtns(); _pdfNoAnim=true; _renderPage(S.pdfPage); }
function pdfToggleSidebar(){
  _pdfSidebarHidden=!_pdfSidebarHidden;
  const layout=document.getElementById('pdf-layout');
  if(layout) layout.classList.toggle('sb-hidden',_pdfSidebarHidden);
  if(_pdfZoom==='fit') setTimeout(()=>{_pdfNoAnim=true;_renderPage(S.pdfPage);},50);
}

function pdfToggleFullpage(){
  _pdfFullpage=!_pdfFullpage;
  const layout=document.getElementById('pdf-layout');
  if(layout) layout.classList.toggle('fullpage',_pdfFullpage);
  // Always restore TOC to visible when entering or leaving fullpage
  _pdfSidebarHidden=false;
  if(layout) layout.classList.remove('sb-hidden');
  const btn=document.getElementById('pfn-toc-btn');
  if(btn){const lbl=btn.querySelector('.pfn-toc-label');
    btn.title='अनुक्रमणिका लुकाउनुहोस्';if(lbl)lbl.textContent=' लुकाउनुहोस्';}
  const nav=document.getElementById('pdf-float-nav');
  if(nav) nav.classList.toggle('visible',_pdfFullpage);
  const fbtn=document.getElementById('pfullbtn');
  if(fbtn){ fbtn.title=_pdfFullpage?'सामान्य दृश्य (F)':'पूर्ण पर्दा (F)'; fbtn.innerHTML=icon(_pdfFullpage?'compress':'expand'); }
  document.body.style.overflow=_pdfFullpage?'hidden':'';
  if(_pdfFullpage){ _pdfZoom='fit'; setTimeout(()=>_renderPage(S.pdfPage),50); }
  else _renderPage(S.pdfPage);
}
function pdfFullpageTocToggle(){
  if(window.innerWidth>800){
    _pdfSidebarHidden=!_pdfSidebarHidden;
    const layout=document.getElementById('pdf-layout');
    if(layout) layout.classList.toggle('sb-hidden',_pdfSidebarHidden);
    const btn=document.getElementById('pfn-toc-btn');
    if(btn){
      const lbl=btn.querySelector('.pfn-toc-label');
      if(_pdfSidebarHidden){
        btn.title='अनुक्रमणिका देखाउनुहोस्';
        if(lbl) lbl.textContent=' अनुक्रम';
      } else {
        btn.title='अनुक्रमणिका लुकाउनुहोस्';
        if(lbl) lbl.textContent=' लुकाउनुहोस्';
      }
    }
    if(_pdfZoom==='fit') setTimeout(()=>{_pdfNoAnim=true;_renderPage(S.pdfPage);},50);
  } else {
    pdfToggleDrawer();
  }
}
function pdfDrawerOpen(){
  _pdfDrawerOpen=true;
  const d=document.getElementById('pdf-toc-drawer');
  const o=document.getElementById('pdf-drawer-overlay');
  if(d) d.classList.add('open');
  if(o) o.classList.add('open');
  // Scroll current article into view (centred so user can see items above/below)
  setTimeout(()=>{
    const active=d&&d.querySelector('.pdf-ti[aria-current="true"]');
    if(active) active.scrollIntoView({block:'center',behavior:'smooth'});
  },50);
}
function pdfDrawerClose(){
  _pdfDrawerOpen=false;
  const d=document.getElementById('pdf-toc-drawer');
  const o=document.getElementById('pdf-drawer-overlay');
  if(d) d.classList.remove('open');
  if(o) o.classList.remove('open');
}
function pdfToggleDrawer(){ _pdfDrawerOpen?pdfDrawerClose():pdfDrawerOpen(); }
function pdfDrawerJump(n){ pdfDrawerClose(); pdfJump(n); }

function pdfFilterAuthor(author){
  const items=document.querySelectorAll('.pdf-ti');
  items.forEach(btn=>{
    const li=btn.closest('li');
    if(!li) return;
    if(!author){ li.style.display=''; return; }
    const auth=btn.querySelector('.pdf-ti-auth');
    li.style.display=(auth&&auth.textContent.startsWith(author))?'':'none';
  });
  // Also hide/show genre group headers
  document.querySelectorAll('.pdf-tg').forEach(tg=>{
    const next=tg.nextElementSibling;
    // show group label if at least one sibling li is visible
    let el=tg.nextElementSibling, vis=false;
    while(el&&!el.classList.contains('pdf-tg')){
      if(el.style.display!=='none') vis=true;
      el=el.nextElementSibling;
    }
    tg.style.display=vis?'':'none';
  });
}

/* ── Keyboard handler ── */
function _pdfKey(e){
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); pdfPrev(); }
  if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){ e.preventDefault(); pdfNext(); }
  if(e.key==='Home'){ e.preventDefault(); pdfJump(1); }
  if(e.key==='End'){ e.preventDefault(); pdfJump(_pdfTotal); }
  if(e.key==='Escape'){
    e.preventDefault();
    if(_pdfDrawerOpen){ pdfDrawerClose(); }
    else if(_pdfFullpage){ pdfToggleFullpage(); }
  }
  if(e.key==='f'||e.key==='F'){ e.preventDefault(); pdfToggleFullpage(); }
}

/* ════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════ */
function render(){
  document.getElementById('app').innerHTML =
    S.view==='shelf' ? viewShelf() :
    S.view==='volume' ? viewVolume() :
    S.view==='pdf' ? viewPdfReader() :
    S.view==='journey' ? viewJourney() :
    S.view==='allContributors' ? viewAllContributors() :
    viewContributors();
  if(S.view==='pdf') setTimeout(_initPdfReader, 0);
}

/* ════════════════════════════════════════════════════
   INIT — hash routing
   ════════════════════════════════════════════════════ */
function _applyParsed(parsed){
  const prev = S.view;
  if(prev==='pdf' && parsed.view!=='pdf'){
    document.removeEventListener('keydown',_pdfKey);
    document.body.style.overflow='';
  }
  if(parsed.view==='pdf' && prev!=='pdf'){
    _pdfFullpage=false; _pdfDrawerOpen=false;
    document.addEventListener('keydown',_pdfKey);
    window.scrollTo({top:0, behavior:'instant'});
  }
  if(parsed.view==='volume' && !('itemId' in parsed)) parsed.itemId=0;
  if(parsed.view==='shelf') parsed.showColophon=false;
  Object.assign(S, parsed);
  _updateNav();
  render();
  if(parsed.view==='volume'){
    const art = document.querySelector('article.page');
    if(art) art.scrollIntoView({behavior:'smooth', block:'start'});
    else window.scrollTo({top:0, behavior:'smooth'});
  } else if(parsed.view!=='pdf'){
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

window.addEventListener('popstate', function(){ _applyParsed(_parseHash()); });

function _initFromHash(){
  const parsed = _parseHash();
  _applyParsed(parsed);
  history.replaceState(null,'',_stateHash());
}

_initFromHash();
</script>
